name: Generate Snake
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Nouzen244
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23ffffff
            dist/snake-light.svg?palette=github-light&color_snake=%23000000
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
