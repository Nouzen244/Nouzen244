<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <clipPath id="screen">
      <rect x="1" y="33" width="638" height="216"/>
    </clipPath>

    <clipPath id="t1"><rect x="20" y="44" width="0" height="20">
      <animate attributeName="width" values="0;0;72;72" keyTimes="0;0.03;0.09;1" dur="10s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="20" y="100" width="0" height="20">
      <animate attributeName="width" values="0;0;130;130" keyTimes="0;0.18;0.26;1" dur="10s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="20" y="156" width="0" height="20">
      <animate attributeName="width" values="0;0;122;122" keyTimes="0;0.35;0.43;1" dur="10s" repeatCount="indefinite"/>
    </rect></clipPath>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#FFFFFF" opacity="0.012"/>
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="250" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <path d="M0 10 A10 10 0 0 1 10 0 H630 A10 10 0 0 1 640 10 V32 H0 Z" fill="#161B22"/>
  <line x1="0" y1="32" x2="640" y2="32" stroke="#30363D" stroke-width="1"/>

  <circle cx="22" cy="16" r="5" fill="#484F58"/>
  <circle cx="42" cy="16" r="5" fill="#6E7681"/>
  <circle cx="62" cy="16" r="5" fill="#8B949E"/>
  <text x="320" y="21" fill="#6E7681" font-size="12" text-anchor="middle">nouzen@dev</text>

  <g opacity="1">
    <animate attributeName="opacity" values="1;0.94;1;0.97;1;1" keyTimes="0;0.006;0.014;0.02;0.03;1" dur="10s" repeatCount="indefinite"/>

    <text x="20" y="58" font-size="14" fill="#E6EDF3" clip-path="url(#t1)">$ whoami</text>

    <text x="20" y="84" font-size="14" fill="#8B949E" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.125;1" dur="10s" repeatCount="indefinite"/>
      nouzen / gamedev / ai-ml / fullstack
    </text>

    <text x="20" y="114" font-size="14" fill="#E6EDF3" clip-path="url(#t2)">$ cat stack.txt</text>

    <text x="20" y="140" font-size="14" fill="#8B949E" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.29;0.295;1" dur="10s" repeatCount="indefinite"/>
      python  godot  pytorch  opencv  sqlite
    </text>

    <text x="20" y="170" font-size="14" fill="#E6EDF3" clip-path="url(#t3)">$ ls projects/</text>

    <text x="20" y="196" font-size="14" fill="#8B949E" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.465;1" dur="10s" repeatCount="indefinite"/>
      stalzone-tools/  navigator/  aachen-last-session/
    </text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.525;1" dur="10s" repeatCount="indefinite"/>
      <text x="20" y="226" font-size="14" fill="#E6EDF3">$</text>
      <rect x="37" y="214" width="8" height="16" fill="#E6EDF3" filter="url(#glow)">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g clip-path="url(#screen)">
    <rect x="1" y="33" width="638" height="216" fill="url(#lines)"/>
    <rect x="1" y="-70" width="638" height="70" fill="url(#scan)">
      <animate attributeName="y" values="-70;250" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
